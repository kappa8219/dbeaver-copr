name: Copr build

on:
  push:
    branches:
      - main
    paths:
      - .copr/Makefile
      - dbeaver-ce.spec
      - .github/workflows/copr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Copr CLI
        run: pip install copr-cli

      - name: Configure Copr CLI
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = $COPR_LOGIN
          username = $COPR_USERNAME
          token = $COPR_TOKEN
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Submit Copr SCM build
        run: |
          copr-cli buildscm ok8219/DBeaver \
            --clone-url https://github.com/${{ github.repository }}.git \
            --commit "${{ github.sha }}" \
            --subdir .copr \
            --spec ../dbeaver-ce.spec \
            --method make_srpm \
            --enable-net on \
            --nowait \
            -r fedora-43-x86_64 \
            -r fedora-44-x86_64 \
            -r fedora-45-x86_64
